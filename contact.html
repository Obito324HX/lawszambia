<meta name="description" content="Contact the Lusaka Animal Welfare Society: call, email or visit the shelter at Council Yard, Sadzu Road, behind Levy Junction Mall.">
<meta property="og:title" content="Contact us | Lusaka Animal Welfare Society">

<meta property="og:type" content="website">

<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,600;12..96,700;12..96,800&family=Newsreader:ital,opsz,wght@0,6..72,400;0,6..72,500;1,6..72,400&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/styles.css">

<body data-page="contact">
<div id="site-header"></div>
<main id="main">
<div class="wrap page-head"><h1>Get in touch</h1>
<p class="lede">Questions about adoption, volunteering or an animal in need? We are here to help.</p></div>
<div class="wrap"><div class="cards" style="grid-template-columns:repeat(auto-fit,minmax(320px,1fr));align-items:start">
  <form class="card form" id="contact-form">
    <div><label class="lbl" for="name">Your name</label><input class="field" id="name" name="name" required autocomplete="name"></div>
    <div><label class="lbl" for="phone">Phone number (optional)</label><input class="field" id="phone" name="phone" type="tel" autocomplete="tel"></div>
    <div><label class="lbl" for="topic">What is this about?</label>
      <select class="field" id="topic" name="topic">
        <option>Adoption enquiry</option><option>Volunteering</option><option>Membership</option><option>Report an animal in need</option><option>Something else</option>
      </select></div>
    <div><label class="lbl" for="message">Message</label><textarea class="field" id="message" name="message" required></textarea></div>
    <button class="btn btn-primary" type="submit">Send by email</button>
  </form>
  <div class="card"><h3>Visit or call</h3>
    <ul class="rows">
      <li><span class="k">Address</span><span class="v">Council Yard, Sadzu Rd, behind Levy Junction Mall, Lusaka</span></li>
      <li><span class="k">Phone</span><span class="v"><a href="tel:+260966242776">+260 96 6242776</a></span></li>
      <li><span class="k">WhatsApp</span><span class="v"><a href="https://wa.me/260966779896" rel="noopener">+260 96 677 9896</a></span></li>
      <li><span class="k">Email</span><span class="v"><a href="mailto:lusakaanimalwelfaresociety@gmail.com">lusakaanimalwelfaresociety@gmail.com</a></span></li>
    </ul>
  </div>
</div>
<div style="margin-top:28px"><iframe class="map" title="Map showing the LAWS shelter in Lusaka" loading="lazy" src="https://www.google.com/maps?q=-15.411562,28.285047(Lusaka+Animal+Welfare+Society)&z=17&output=embed"></iframe>
<p style="margin-top:16px"><a class="btn btn-ghost" href="https://maps.app.goo.gl/kT3uDbtKeD8PkwXx9" rel="noopener">Get directions</a></p></div>
</div>
<div style="height:clamp(48px,7vw,96px)"></div>
</main>

<div id="site-footer"></div>
<script src="js/data.js"></script>
<script src="js/main.js"></script>
</body>
</html>
